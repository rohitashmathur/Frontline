plugins { id 'com.android.application' }

android {
    namespace 'com.frontline.offline'
    compileSdk 35
    defaultConfig {
        applicationId 'com.frontline.offline'
        minSdk 24
        targetSdk 35
        versionCode 13
        versionName '0.12.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
